name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          path: ARES-FRC

      - name: Check out ARESLib
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: master
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish ARESLib dependencies locally
        working-directory: ARESLib-Kotlin
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Verify generated project and run tests
        working-directory: ARES-FRC
        run: ./gradlew verifyAresProject test -Pares.usePublishedLib=true --no-daemon
