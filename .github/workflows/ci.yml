name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          path: ARES-FRC

      - name: Check out matching ARESLib feature dependency
        if: github.event.pull_request.head.ref == 'codex/zero-code-runtime-integration' || github.ref_name == 'codex/zero-code-runtime-integration'
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: codex/zero-code-runtime-integration
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish matching ARESLib validation repository
        if: github.event.pull_request.head.ref == 'codex/zero-code-runtime-integration' || github.ref_name == 'codex/zero-code-runtime-integration'
        working-directory: ARESLib-Kotlin
        run: ./gradlew apiCheck publishReleaseValidation --no-parallel --no-daemon

      - name: Select matching ARESLib validation repository
        if: github.event.pull_request.head.ref == 'codex/zero-code-runtime-integration' || github.ref_name == 'codex/zero-code-runtime-integration'
        run: echo "ORG_GRADLE_PROJECT_aresRepository=file://${GITHUB_WORKSPACE}/ARESLib-Kotlin/build/release-repository" >> "$GITHUB_ENV"

      - name: Verify generated project and run tests
        working-directory: ARES-FRC
        run: ./gradlew verifyAresProject test --no-daemon
