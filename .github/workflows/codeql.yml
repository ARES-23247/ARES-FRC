name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '29 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: frc-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          path: ARES-FRC

      - name: Check out matching ARESLib feature dependency
        if: github.event.pull_request.head.ref == 'codex/ares-8-0-0-integration' || github.ref_name == 'codex/ares-8-0-0-integration'
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: codex/ares-8-0-0-runtime
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-FRC/src

      - name: Publish matching ARESLib validation repository
        if: github.event.pull_request.head.ref == 'codex/ares-8-0-0-integration' || github.ref_name == 'codex/ares-8-0-0-integration'
        working-directory: ARESLib-Kotlin
        run: ./gradlew apiCheck publishReleaseValidation -ParesVersion=8.0.0-rc.6ecf2b9fb12b --no-parallel --no-daemon

      - name: Select matching ARESLib validation repository
        if: github.event.pull_request.head.ref == 'codex/ares-8-0-0-integration' || github.ref_name == 'codex/ares-8-0-0-integration'
        run: |
          echo "ORG_GRADLE_PROJECT_aresVersion=8.0.0-rc.6ecf2b9fb12b" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_aresRepository=file://${GITHUB_WORKSPACE}/ARESLib-Kotlin/build/release-repository" >> "$GITHUB_ENV"

      - name: Compile FRC sources
        working-directory: ARES-FRC
        run: ./gradlew classes testClasses --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
