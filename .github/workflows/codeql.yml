name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '29 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: frc-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FRC
        uses: actions/checkout@v4
        with:
          path: ARES-FRC

      - name: Check out ARESLib
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: master
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-FRC/src
            paths-ignore:
              - ARESLib-Kotlin/**

      - name: Publish ARESLib dependencies locally
        working-directory: ARESLib-Kotlin
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Compile FRC sources
        working-directory: ARES-FRC
        run: ./gradlew classes testClasses -Pares.usePublishedLib=true --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
