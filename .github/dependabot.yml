version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      kotlin-and-test:
        patterns: ["org.jetbrains.kotlin*", "org.junit*", "io.mockk*", "org.mockito*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "edu.wpi.first.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.ctre.phoenix6:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
